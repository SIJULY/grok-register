{% extends "base.html" %}

{% block title %}环境配置{% endblock %}

{% block content %}
<div class="mb-6 flex justify-between items-end">
    <div>
        <h2 class="text-2xl font-bold text-gray-800">环境配置 (Settings)</h2>
        <p class="text-gray-600 mt-1">编辑 .env 文件中的配置项。修改后即时生效（针对下一次运行的脚本）。</p>
    </div>
    <div id="toast" class="hidden opacity-0 transition-opacity duration-300 bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded shadow-sm">
        <span class="block sm:inline">配置已成功保存！</span>
    </div>
</div>

<div class="space-y-6">
    
    <!-- 代理配置区域 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
            <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-globe text-blue-500 mr-2"></i>代理配置</h3>
        </div>
        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">代理地址 (GROK_PROXY)</label>
                    <input type="text" id="GROK_PROXY" value="{{ config.get('GROK_PROXY', '') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors" placeholder="例如: http://127.0.0.1:7897">
                    <p class="text-xs text-gray-500 mt-1.5">留空表示直连。主要用于注册及 Device Flow 等网络请求。</p>
                </div>
            </div>
        </div>
        <div class="px-6 py-3 border-t border-gray-100 bg-gray-50 flex justify-end">
            <button onclick="saveGroup(['GROK_PROXY'])" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 px-5 rounded-md transition-colors shadow-sm flex items-center">
                <i class="fa-solid fa-save mr-2"></i> 保存配置
            </button>
        </div>
    </div>

    <!-- 邮箱配置区域 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
            <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-envelope text-blue-500 mr-2"></i>邮箱配置</h3>
        </div>
        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">邮箱类型</label>
                    <input type="hidden" id="EMAIL_PROVIDER" value="domain">
                    <input type="text" value="自建域名邮箱 (domain)" readonly class="w-full bg-gray-100 border border-gray-300 text-gray-700 rounded-md shadow-sm px-3 py-2">
                </div>
            </div>
            
            <div id="domain_config" class="mt-6 border-t border-gray-200 pt-6">
                <h4 class="text-md font-semibold text-gray-700 mb-4">自建域名邮箱配置</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">获取邮箱模式 (DOMAIN_MAIL_MODE)</label>
                        <select id="DOMAIN_MAIL_MODE" onchange="toggleDomainModeConfig()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                            <option value="random" {% if config.get('DOMAIN_MAIL_MODE', 'random') == 'random' %}selected{% endif %}>本地随机生成前缀 (random)</option>
                            <option value="api" {% if config.get('DOMAIN_MAIL_MODE') == 'api' %}selected{% endif %}>调用 API 获取随机邮箱 (api)</option>
                        </select>
                    </div>

                    <div class="md:col-span-2 api-mode-only">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">获取邮箱接口 URL (DOMAIN_MAIL_GENERATE_API_URL)</label>
                        <input type="text" id="DOMAIN_MAIL_GENERATE_API_URL" value="{{ config.get('DOMAIN_MAIL_GENERATE_API_URL', '') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors" placeholder="例如: http://api.example.com/api/random-mailbox?api_key=xxx">
                    </div>

                    <div class="random-mode-only">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">接收域名 (DOMAIN_MAIL_DOMAIN)</label>
                        <input type="text" id="DOMAIN_MAIL_DOMAIN" value="{{ config.get('DOMAIN_MAIL_DOMAIN', '') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors" placeholder="例如: example.com">
                    </div>
                    <div class="random-mode-only">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">邮箱前缀 (DOMAIN_MAIL_PREFIX)</label>
                        <input type="text" id="DOMAIN_MAIL_PREFIX" value="{{ config.get('DOMAIN_MAIL_PREFIX', 'grok') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                    </div>
                    <div class="random-mode-only">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">随机长度 (DOMAIN_MAIL_RANDOM_LENGTH)</label>
                        <input type="number" id="DOMAIN_MAIL_RANDOM_LENGTH" value="{{ config.get('DOMAIN_MAIL_RANDOM_LENGTH', '10') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">拉信接口 URL (DOMAIN_MAIL_API_URL)</label>
                        <input type="text" id="DOMAIN_MAIL_API_URL" value="{{ config.get('DOMAIN_MAIL_API_URL', '') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors" placeholder="例如: http://api.example.com/Mail?token=xxx&mail={mail}">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">超时时间(秒) (DOMAIN_MAIL_API_TIMEOUT)</label>
                        <input type="number" id="DOMAIN_MAIL_API_TIMEOUT" value="{{ config.get('DOMAIN_MAIL_API_TIMEOUT', '15') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                    </div>
                </div>
            </div>

        </div>
        <div class="px-6 py-3 border-t border-gray-100 bg-gray-50 flex justify-end">
            <button onclick="saveEmailConfig()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 px-5 rounded-md transition-colors shadow-sm flex items-center">
                <i class="fa-solid fa-save mr-2"></i> 保存配置
            </button>
        </div>
    </div>

    <!-- CPA 配置区域 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
            <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-cloud-arrow-up text-blue-500 mr-2"></i>CPA 上传配置</h3>
        </div>
        <div class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">开启自动上传 (GROK_AUTO_UPLOAD_CPA)</label>
                <select id="GROK_AUTO_UPLOAD_CPA" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                    <option value="1" {% if config.get('GROK_AUTO_UPLOAD_CPA') in ['1', 'true', 'yes'] %}selected{% endif %}>开启 (True)</option>
                    <option value="0" {% if config.get('GROK_AUTO_UPLOAD_CPA') in ['0', 'false', 'no'] %}selected{% endif %}>关闭 (False)</option>
                </select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">CPA 面板地址 (GROK_CPA_API_URL)</label>
                    <input type="text" id="GROK_CPA_API_URL" value="{{ config.get('GROK_CPA_API_URL', 'https://ai.sijuly.tk') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">管理员密码/Token (GROK_CPA_API_TOKEN)</label>
                    <input type="password" id="GROK_CPA_API_TOKEN" value="{{ config.get('GROK_CPA_API_TOKEN', '') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                </div>
            </div>
        </div>
        <div class="px-6 py-3 border-t border-gray-100 bg-gray-50 flex justify-end">
            <button onclick="saveGroup(['GROK_AUTO_UPLOAD_CPA', 'GROK_CPA_API_URL', 'GROK_CPA_API_TOKEN'])" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 px-5 rounded-md transition-colors shadow-sm flex items-center">
                <i class="fa-solid fa-save mr-2"></i> 保存配置
            </button>
        </div>
    </div>
    
    <!-- 其他配置 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
            <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-sliders text-blue-500 mr-2"></i>其他高级配置</h3>
        </div>
        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">2Captcha 密钥 (TWOCAPTCHA_KEY)</label>
                    <input type="text" id="TWOCAPTCHA_KEY" value="{{ config.get('TWOCAPTCHA_KEY', '') }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors" placeholder="填入 2Captcha 的 API Key">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">并发数 (THREADS)</label>
                    <input type="number" id="THREADS" value="{{ config.get('THREADS', config.get('GROK_THREADS', '1')) }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-md shadow-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 px-3 py-2 transition-colors">
                </div>
            </div>
        </div>
        <div class="px-6 py-3 border-t border-gray-100 bg-gray-50 flex justify-end">
            <button onclick="saveGroup(['TWOCAPTCHA_KEY', 'THREADS'])" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 px-5 rounded-md transition-colors shadow-sm flex items-center">
                <i class="fa-solid fa-save mr-2"></i> 保存配置
            </button>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        toggleEmailConfig();
    });

    function toggleEmailConfig() {
        document.getElementById('domain_config').classList.remove('hidden');
        toggleDomainModeConfig();
    }

    function toggleDomainModeConfig() {
        const mode = document.getElementById('DOMAIN_MAIL_MODE').value;
        const apiModeOnly = document.querySelectorAll('.api-mode-only');
        const randomModeOnly = document.querySelectorAll('.random-mode-only');
        
        if (mode === 'api') {
            apiModeOnly.forEach(el => el.style.display = 'block');
            randomModeOnly.forEach(el => el.style.display = 'none');
        } else {
            apiModeOnly.forEach(el => el.style.display = 'none');
            randomModeOnly.forEach(el => el.style.display = 'block');
        }
    }

    function saveEmailConfig() {
        const keys = ['EMAIL_PROVIDER', 'DOMAIN_MAIL_MODE', 'DOMAIN_MAIL_GENERATE_API_URL', 'DOMAIN_MAIL_DOMAIN', 'DOMAIN_MAIL_PREFIX', 'DOMAIN_MAIL_API_URL', 'DOMAIN_MAIL_RANDOM_LENGTH', 'DOMAIN_MAIL_API_TIMEOUT'];
        saveGroup(keys);
    }
    let toastTimeout;
    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.remove('opacity-0'), 10);
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.classList.add('hidden'), 300);
        }, 2500);
    }

    function saveGroup(keys) {
        const payload = {};
        for (let key of keys) {
            const input = document.getElementById(key);
            if (input) {
                payload[key] = input.value;
            }
        }
        
        fetch('/api/settings/update_single', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                showToast();
            } else {
                alert("保存失败: " + data.message);
            }
        })
        .catch(err => {
            console.error("Fetch error:", err);
            alert("请求错误，详见控制台。");
        });
    }
</script>
{% endblock %}
